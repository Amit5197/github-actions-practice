name: smart

on:
  push: 

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
steps:
      # 1. Replace actions/checkout@v6
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # Pin to v6 commit SHA

      # 2. Replace actions/setup-python@v6
      - name: Set up Python
        uses: actions/setup-python@d27e3f3d7c64b4bbf8e4abfb9b62b690f7c382db # Pin to v6 commit SHA
        
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: run linter
        run: flake8 app.py

  test:
    runs-on: ubuntu-latest
    steps:
      - name: test
        run: echo "Testing......."

  summary:
    runs-on: ubuntu-latest
    needs: [lint-test, test]
    steps:
      - name: print branch & commit
        shell: bash
        run: |
          echo "branch name: ${{ github.ref_name }}"
          echo "commit message: ${{ github.event.commits[0].message }}"
          
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "This is a push to the MAIN branch"
          else
            echo "This is a push to a FEATURE branch"
          fi
