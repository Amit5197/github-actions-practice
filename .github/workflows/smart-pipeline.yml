name: smart

on:
 push: 

jobs:
lint-test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.2.2 pinned to a specific SHA
      - name: checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-python@v5.4.0 pinned to a specific SHA
      - name: setup python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'

      # Everything combined into ONE run block targeting the correct file
      - name: Install dependencies and run linter
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8
          python -m flake8 log_analyzer_cli.py --exit-zero

  test:
    runs-on: ubuntu-latest
    steps:
      - name: test
        run: echo "Testing......."

  summary:
    runs-on: ubuntu-latest
    needs: [lint-test,test]
    steps:
      - name: print branch & commit
        run: |
         echo "branch name:" ${{ github.ref_name }}
         echo "commit message:" ${{ github.event.commits[0].message }}
         
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "This is a push to the MAIN branch"
          else
            echo "This is a push to a FEATURE branch"

          fi
