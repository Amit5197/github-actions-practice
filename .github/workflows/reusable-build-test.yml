name: Reusable — Build & Test

on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version to use'
        type: string
        default: '20'
      run_tests:
        description: 'Whether to run tests'
        type: boolean
        default: true
    outputs:
      test_result:
        description: 'Result of the test run: passed or failed'
        value: ${{ jobs.build-test.outputs.test_result }}

jobs:
  build-test:
    name: Build & Test (Node ${{ inputs.node_version }})
    runs-on: ubuntu-latest

    outputs:
      test_result: ${{ steps.set-result.outputs.test_result }}

    steps:
      # Pinned to exact SHA for actions/checkout@v4
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Pinned to exact SHA for actions/setup-node@v4 (And completely clean of cache properties)
      - name: Set up Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@3922559a7e22c7b84f29a4be3d9813dd28cf45d5
        with:
          node-version: ${{ inputs.node_version }}

      # Safe fallback installation step
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "No package.json file found, skipping install."
          fi

      - name: Run tests
        if: ${{ inputs.run_tests == true }}
        id: run-tests
        run: npm test || echo "No test script found"

      - name: Set output
        id: set-result
        if: always()
        run: |
          if [[ "${{ steps.run-tests.outcome }}" == "success" || "${{ inputs.run_tests }}" == "false" ]]; then
            echo "test_result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "test_result=failed" >> "$GITHUB_OUTPUT"
          fi
