name: PR Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

jobs:
  build-test:
    name: Build & Test
    uses: ./.github/workflows/reusable-build-test.yml

  pr-comment:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Print PR summary
        run: |
          echo "PR checks passed for branch: ${{ github.head_ref }}"
