name: Main Branch Pipeline

on:
  push:
    branches:
      - main

jobs:
  # Job 1: Call the reusable build-test workflow
  build-test:
    name: Run Tests
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      node_version: '20'
      run_tests: true

  # Job 2: Call the reusable Docker workflow (Depends on Job 1)
  build-docker:
    name: Build & Push Docker Image
    needs: build-test
    uses: ./.github/workflows/reusable-docker.yml
    with:
      # Pass both tags as required by the task
      tag_latest: 'latest'
      tag_sha: 'sha-${{ github.sha }}' # Note: If your reusable workflow strictly requires a 7-character short SHA, see the note below.

  # Job 3: Deploy job (Depends on Job 2)
  deploy:
    name: Deploy to Production
    needs: build-docker
    runs-on: ubuntu-latest
    environment: production # Uses the environment configured in Settings -> Environments

    steps:
      - name: Deploying image
        run: |
          # Replace <your-image-url> with your actual container registry URL if needed
          echo "Deploying image: my-docker-reg.azurecr.io/app:sha-${{ github.sha }} to production"
