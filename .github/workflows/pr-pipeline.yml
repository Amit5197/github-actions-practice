name: PR Pipeline

# 1. Trigger: pull_request to main (types: opened, synchronize)
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

jobs:
  # 2. Call the reusable build-test workflow
  build-test:
    name: Build & Test
    uses: Amit5197/github-actions-practice/.github/workflows/reusable-build-test.yml@Amit5197-patch-3
    with:
      node_version: '20'
      run_tests: true

  # 3. Add a standalone job pr-comment
  pr-comment:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    needs: build-test # Runs after the build-test job
    steps:
      - name: Print PR summary
        run: |
          echo "PR checks passed for branch: ${{ github.head_ref }}"
