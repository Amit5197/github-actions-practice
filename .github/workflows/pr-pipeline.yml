name: PR Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4 pinned to exact commit SHA
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-node@v4 pinned to exact commit SHA (No caching, no lockfile needed!)
      - name: Set up Node.js
        uses: actions/setup-node@3922559a7e22c7b84f29a4be3d9813dd28cf45d5
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "No package.json found, skipping."
          fi
