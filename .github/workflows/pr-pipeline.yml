name: PR Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

jobs:
  build-test:
    name: Build & Test
    # Using the full path with the @ branch reference forces GitHub to ignore the main branch version
    uses: Amit5197/github-actions-practice/.github/workflows/reusable-build-test.yml@Amit5197-patch-3
    with:
      node_version: '20'
      run_tests: true

  pr-comment:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Print PR summary
        run: |
          echo "PR checks passed for branch: ${{ github.head_ref }}"
