name: Run Python Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Since requirements.txt is inside the 'src' folder, we tell the runner where to find it
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; 
          fi

      # If you write python tests later (e.g., using pytest), you can run them here
      - name: Run Script Check
        run: python log_analyzer_cli.py --help
